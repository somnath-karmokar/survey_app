<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sudraw</title>
  <style>
    :root { --bg: #1d1814; --fg: #ffffff; --accent: #f7b500; --muted: rgba(255, 255, 255, 0.7); }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: var(--bg); color: var(--fg); text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    main { max-width: 360px; }
    h1 { font-size: 1.5rem; margin: 16px 0 8px; }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 24px; }
    .icon { font-size: 3rem; }
    button {
      background: var(--accent); color: #1d1814; border: 0; border-radius: 999px;
      padding: 12px 28px; font-size: 1rem; font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">📶</div>
    <h1>You're offline</h1>
    <p>Sudraw needs an internet connection. Check your Wi-Fi or mobile data, then try again.</p>
    <button type="button" onclick="window.location.href = 'https://sudraw.com'">Try again</button>
  </main>
</body>
</html>
