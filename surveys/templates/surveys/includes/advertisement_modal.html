<!-- templates/surveys/includes/advertisement_modal.html -->
<div class="modal fade" id="advertisementModal" tabindex="-1" aria-labelledby="advertisementModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="advertisementModalLabel">Advertisement</h5>
                <!-- Hidden until ad is clicked -->
                <button type="button" id="ad-modal-close-btn" class="btn-close d-none" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center">
                <div id="bitlabs-ad-container" style="width:100%; min-width:300px; min-height:250px;"></div>
                <p id="ad-modal-hint" class="text-muted mt-3 small d-none">
                    <i class="fas fa-arrow-up me-1"></i> Click on the advertisement above to unlock the Continue button
                </p>
            </div>
            <div class="modal-footer justify-content-between align-items-center">
                <span id="ad-modal-status" class="small text-muted"></span>
                <!-- Hidden until ad is clicked -->
                <button type="button" id="ad-modal-continue-btn" class="btn btn-primary d-none" data-bs-dismiss="modal">
                    <i class="fas fa-arrow-right me-1"></i>Continue Survey
                </button>
            </div>
        </div>
    </div>
</div>

<!-- BitLabs (bitlabs.ai) ad widget -->
<script type="module" src="https://sdk.bitlabs.ai/bitlabs-sdk-v1.0.0.js"></script>
<link rel="stylesheet" href="https://sdk.bitlabs.ai/bitlabs-sdk-v1.0.0.css">
<script>
(function() {
    var container = document.getElementById('bitlabs-ad-container');
    if (!container || container.dataset.bitlabsInit) return;
    container.dataset.bitlabsInit = 'true';

    function initBitlabs(retriesLeft) {
        if (window.bitlabsSDK) {
            window.bitlabsSDK.init('{{ bitlabs_app_token|escapejs }}', '{{ request.user.id }}').then(function() {
                window.bitlabsSDK.showWidget('#bitlabs-ad-container', 'full-width');
            });
        } else if (retriesLeft > 0) {
            setTimeout(function() { initBitlabs(retriesLeft - 1); }, 200);
        }
    }
    initBitlabs(25); // SDK script is loaded as a module, so retry briefly until it's ready
})();
</script>
